[project]
name = "latent-materials"
version = "0.0.1"
description = "Small decoders fitted to families of PBR materials, for compact texture distribution"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "diffusers>=0.30",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "pyarrow>=15",
    "numpy>=1.26",
    "pillow>=10",
    "lpips==0.1.4",
]

[project.scripts]
latent-materials = "latent_materials.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latent_materials"]
